name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j 4
      - name: Perft and search tests
        run: ctest --test-dir build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Self-play vs a random mover, every move checked by python-chess
        run: |
          pip install chess
          python3 tests/selfplay.py --games 20 --vs-random
