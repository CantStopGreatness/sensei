# lichess-bot config for Sensei. Symlink or copy to lichess-bot/config.yml.
# Assumes lichess-bot sits next to a release clone of this repo, ~/lichess-bot and ~/sensei-release,
# kept on main, so development branches and builds never reach live games.
# Keys left out here get lichess-bot's own defaults.

# Never commit the token. Put it in the environment instead:
#   export LICHESS_BOT_TOKEN=lip_...
token: ""
url: "https://lichess.org/"

engine:
  dir: "../sensei-release/build/"
  name: "sensei"
  protocol: "uci"
  ponder: false            # Sensei doesn't support pondering yet
  uci_options:
    Hash: 64

  # Moves fetched from Lichess instead of searched. Both need at least min_time seconds left.
  online_moves:
    max_out_of_book_moves: 10    # give up on the book after this many misses in a game
    lichess_opening_explorer:    # opening book: the masters database
      enabled: true
      min_time: 20
      source: "masters"
      sort: "winrate"            # best-scoring move among well-played ones
      min_games: 25
    online_egtb:                 # perfect endgame play with 7 pieces or fewer
      enabled: true
      min_time: 20
      max_pieces: 7
      source: "lichess"
      move_quality: "best"

move_overhead: 1000        # ms kept in hand per move for network lag

challenge:
  concurrency: 1           # one game at a time; search is single-threaded
  accept_bot: true
  only_bot: false
  variants:
    - standard
  time_controls:
    - bullet
    - blitz
    - rapid
  modes:
    - casual
    - rated
  min_base: 60             # nothing faster than 1+0: lag hurts most there

# When idle, challenge other bots to rated blitz so the rating settles quickly.
matchmaking:
  allow_matchmaking: true
  challenge_timeout: 30    # minutes idle before sending a challenge
  challenge_initial_time:
    - 180
  challenge_increment:
    - 2
  challenge_mode: "rated"
  challenge_variant: "standard"

greeting:
  hello: "Hi! I'm {me}, a chess engine written from scratch in C++. Good luck!"
  goodbye: "Good game!"
